<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gallery - CloudVault</title>
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #f7f8fc;
        }
        header {
            background: #2d89ef;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav a {
            color: white;
            margin-left: 20px;
            text-decoration: none;
            font-weight: 600;
        }
        nav a:hover {
            text-decoration: underline;
        }
        main {
            padding: 40px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 30px;
        }
        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            padding: 10px;
            text-align: center;
        }
        img, video, iframe {
            width: 100%;
            border-radius: 8px;
            max-height: 200px;
            object-fit: cover;
        }
        button {
            background: #2d89ef;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #1b5cb8;
        }
        /* Messages styling */
        .message {
            padding: 20px;
            font-weight: 600;
        }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
<header>
    <h1>CloudVault Gallery</h1>
    <nav>
        <a href="/upload">Upload</a>
        <a href="/logout">Logout</a>
    </nav>
</header>

<!-- Success / Error Messages -->
<div class="message">
    <div th:if="${param.uploaded}" class="success">
        File uploaded successfully!
    </div>
    <div th:if="${param.deleted}" class="success">
        File deleted successfully!
    </div>
    <div th:if="${param.error}" class="error">
        Operation failed. Please try again!
    </div>
</div>

<main>
    <div th:each="doc : ${documents}" class="card">

        <!-- Image -->
        <img th:if="${#strings.contains(doc.fileType, 'image')}"
             th:src="@{'/documents/view/' + ${doc.id}}" alt="Image">

        <!-- Video -->
        <video th:if="${#strings.contains(doc.fileType, 'video')}" controls>
            <source th:src="@{'/documents/view/' + ${doc.id}}" th:type="${doc.fileType}">
        </video>

        <!-- PDF -->
        <iframe th:if="${#strings.contains(doc.fileType, 'pdf')}"
                th:src="@{'/documents/view/' + ${doc.id}}" width="100%" height="200px"></iframe>

        <!-- Other file types -->
        <div th:if="${!#strings.contains(doc.fileType, 'image')
                      and !#strings.contains(doc.fileType, 'video')
                      and !#strings.contains(doc.fileType, 'pdf')}">
            <p th:text="${doc.fileName}"></p>
        </div>

        <!-- Action Buttons -->
        <div>
            <form th:action="@{'/documents/view/' + ${doc.id}}" method="get" style="display:inline;">
                <button type="submit">📂 Open / Download</button>
            </form>

            <form th:action="@{/documents/delete/{id}(id=${doc.id})}" method="post" style="display:inline;">
                <button type="submit" onclick="return confirm('Delete this file?')">🗑 Delete</button>
            </form>
        </div>

    </div>
</main>
</body>
</html>

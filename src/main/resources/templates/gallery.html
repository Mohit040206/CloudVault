<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - CloudVault</title>

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #f7f8fc;
        }
        header {
            background: #2d89ef;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }
        nav a:hover {
            color: #ffe082;
        }
        main {
            padding: 40px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 30px;
        }
        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            padding: 10px;
            text-align: center;
        }
        img, video, iframe {
            width: 100%;
            border-radius: 8px;
            max-height: 200px;
            object-fit: cover;
        }
        button {
            background: #2d89ef;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #1b5cb8;
        }
        .message {
            padding: 20px;
            font-weight: 600;
        }
        .success { color: green; }
        .error { color: red; }
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: flex-start;
            }
            nav a {
                margin: 10px 0;
                display: block;
            }
            main {
                padding: 20px;
                grid-template-columns: 1fr;
            }
            .card {
                max-width: 100%;
                margin: auto;
            }
            img, video, iframe {
                max-height: 150px;
            }
            button {
                width: 100%;
                margin-top: 8px;
            }
        }
    </style>
</head>
<body>
<header>
    <h1>CloudVault Gallery</h1>
    <nav>
        <a href="/user/home">Home</a>
        <a href="/upload">Upload</a>
        <a href="/logout">Logout</a>
    </nav>
</header>

<!-- ✅ Success / Error Messages -->
<div class="message">
    <div th:if="${param.uploaded}" class="success">File uploaded successfully!</div>
    <div th:if="${param.deleted}" class="success">File deleted successfully!</div>
    <div th:if="${param.error}" class="error">Operation failed. Please try again!</div>
</div>

<!-- ✅ Search -->
<div style="text-align:center; margin: 20px;">
    <form th:action="@{/documents/search}" method="get" style="display:inline-flex; gap:10px; align-items:center;">
        <input type="text" name="keyword" th:value="${keyword}" placeholder="Search files..."
               style="padding:10px; width:250px; border:1px solid #ccc; border-radius:6px;">
        <button type="submit"
                style="background:#2d89ef; color:white; border:none; padding:10px 16px; border-radius:6px; cursor:pointer;">
            🔍 Search
        </button>
    </form>
</div>

<!-- ✅ Gallery -->
<main>
    <div th:each="doc : ${documents}" class="card">

        <!-- 🖼 Image -->
        <img th:if="${doc.fileType != null and #strings.contains(doc.fileType, 'image')}"
             th:src="@{'/documents/view/' + ${doc.id}}" alt="Image">

        <!-- 🎥 Video -->
        <video th:if="${doc.fileType != null and #strings.contains(doc.fileType, 'video')}" controls>
            <source th:src="@{'/documents/view/' + ${doc.id}}" th:type="${doc.fileType}">
        </video>

        <!-- 📄 PDF -->
        <iframe th:if="${doc.fileType != null and #strings.contains(doc.fileType, 'pdf')}"
                th:src="@{'/documents/view/' + ${doc.id}}" width="100%" height="200px"></iframe>

        <!-- 🗂 Other file types -->
        <div th:if="${doc.fileType == null
                    or (!#strings.contains(doc.fileType, 'image')
                        and !#strings.contains(doc.fileType, 'video')
                        and !#strings.contains(doc.fileType, 'pdf'))}">
            <p th:text="${doc.fileName}"></p>
        </div>

        <!-- ⚙ Actions -->
        <div>
            <a th:href="@{'/documents/view/' + ${doc.id}}"><button type="button">👁 View</button></a>
            <a th:href="@{'/documents/download/' + ${doc.id}}"><button type="button">⬇ Download</button></a>
            <form th:action="@{/documents/delete/{id}(id=${doc.id})}" method="post" style="display:inline;">
                <button type="submit" onclick="return confirm('Delete this file?')">🗑 Delete</button>
            </form>
        </div>

    </div>
</main>
</body>
</html>

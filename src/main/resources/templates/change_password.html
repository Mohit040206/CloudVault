<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CloudVault - Change Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
        font-family: 'Poppins', sans-serif;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: url('/images/logovault.png') no-repeat center center fixed;
        background-size: cover;
    }
    header { background: #2d89ef; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; }
    nav a { color: white; margin-left: 20px; text-decoration: none; font-weight: 600; }
    main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
    .change-container {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(6px);
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0px 4px 15px rgba(0,0,0,0.2);
        width: 400px;
        text-align: center;
    }
    h2 { margin-bottom: 20px; color: #333; }
    input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; background: rgba(255,255,255,0.9); }
    button { width: 100%; padding: 12px; background-color: #2d89ef; border: none; color: white; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    button:hover { background-color: #1b5cb8; }
    .msg { display: none; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-weight: 600; }
    .success-msg { background: #4caf50; color: white; }
    .error-msg { background: #f44336; color: white; }
    .input-group { position: relative; }
    .toggle-password { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 14px; color: #555; }
    footer { text-align: center; padding: 15px; background: #2d89ef; color: white; margin-top: auto; }
  </style>
</head>
<body>
<header>
  <h1>CloudVault</h1>
  <nav>
    <a href="/user/home">Home</a>
    <a href="/logout">Logout</a>
  </nav>
</header>

<main>
  <div class="change-container">
    <h2>Change Password</h2>

    <div id="message" class="msg"></div>

    <form id="changeForm" method="post" action="/user/change-password">
      <div class="input-group">
        <input type="password" name="oldPassword" placeholder="Old Password" required>
        <span class="toggle-password" onclick="togglePassword('oldPassword')">🫣</span>
      </div>

      <div class="input-group">
        <input type="password" id="newPassword" name="newPassword" placeholder="New Password" required>
        <span class="toggle-password" onclick="togglePassword('newPassword')">🫣</span>
      </div>

      <div class="input-group">
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm New Password" required>
        <span class="toggle-password" onclick="togglePassword('confirmPassword')">🫣</span>
      </div>

      <button type="submit">Change Password</button>
    </form>
  </div>
</main>

<footer>
  © 2025 CloudVault. All Rights Reserved.
</footer>

<script>
  function togglePassword(id) {
      const input = document.getElementById(id);
      input.type = input.type === "password" ? "text" : "password";
  }

  // Optional: simple frontend validation
  document.getElementById("changeForm").addEventListener("submit", function(e){
      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*()_+\[\]{};':"\\|,.<>\/?]).{6,}$/;

      if (newPassword !== confirmPassword) {
          alert("Passwords do not match!");
          e.preventDefault();
      } else if (!regex.test(newPassword)) {
          alert("Password must be at least 6 characters, including uppercase, lowercase, number, and special character.");
          e.preventDefault();
      }
  });
</script>
</body>
</html>

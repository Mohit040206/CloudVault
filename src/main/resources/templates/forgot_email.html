<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudVault - Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; background: url('/images/logovault.png') no-repeat center center fixed; background-size: cover;}
        header { background: #2d89ef; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1);}
        header h1 { margin: 0; }
          nav {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    nav a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s;
    }
    nav a:hover {
      color: #ffe082;
    }
        main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
        .forgot-container { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(6px); padding: 30px; border-radius: 12px; box-shadow: 0px 4px 15px rgba(0,0,0,0.2); width: 400px; text-align: center; }
        h2 { margin-bottom: 20px; color: #333; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; background: rgba(255, 255, 255, 0.9);}
        button { width: 100%; padding: 12px; background-color: #2d89ef; border: none; color: white; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #1b5cb8; }
        .links { margin-top: 15px; font-size: 14px; }
        .links a { color: #2d89ef; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
        .success-msg { display: none; background: #4caf50; color: white; padding: 10px; border-radius: 8px; margin-bottom: 15px; }
         footer {
            text-align: center;
            padding: 15px;
            background: #2d89ef;
            color: white;
            margin-top: auto;
        }
        @media (max-width: 768px) {
    header {
        flex-direction: column;
        align-items: flex-start;
    }
    nav a {
        margin: 10px 0;
        display: block;
    }
    main {
        padding: 20px;
        grid-template-columns: 1fr;
    }
    .card {
        max-width: 100%;
        margin: auto;
    }
    img, video, iframe {
        max-height: 150px;
    }
    button {
        width: 100%;
        margin-top: 8px;
    }
}

    </style>
</head>
<body>
<header>
    <h1>CloudVault</h1>
    <nav>
        <a href="/index">Home</a>
        <a href="/about">About</a>
        <a href="/login">Login</a>
        <a href="/register">Register</a>
    </nav>
</header>

<main>
    <div class="forgot-container">
        <h2>Forgot Password</h2>
        <div id="successMessage" class="success-msg">OTP sent successfully!</div>

        <form id="forgotForm" action="/forgot-password/request" method="post">
            <input type="email" name="email" placeholder="Enter your registered email" required>
            <button type="submit">Send OTP</button>
        </form>

        <div class="links">
            <p>Back to <a href="/login">Login</a></p>
        </div>
    </div>
</main>
<footer>
    © 2025 CloudVault. All Rights Reserved.
</footer>



</body>
</html>

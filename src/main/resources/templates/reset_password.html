<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudVault - Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family:'Poppins',sans-serif; margin:0; padding:0; min-height:100vh; display:flex; flex-direction:column; background:url('/images/logovault.png') no-repeat center center fixed; background-size:cover; }
        header { background:#2d89ef; color:white; padding:15px 30px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
        header h1 { margin:0; }
          nav {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    nav a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s;
    }
    nav a:hover {
      color: #ffe082;
    }
        main { flex:1; display:flex; justify-content:center; align-items:center; padding:40px 20px; }
        .forgot-container { background:rgba(255,255,255,0.85); backdrop-filter:blur(6px); padding:30px; border-radius:12px; box-shadow:0px 4px 15px rgba(0,0,0,0.2); width:400px; text-align:center; }
        h2 { margin-bottom:20px; color:#333; }
        .input-group { position:relative; width:100%; }
        input { width:100%; padding:12px; margin:8px 0; border-radius:8px; border:1px solid #ccc; font-size:14px; background: rgba(255,255,255,0.9); }
        .toggle-password { position:absolute; right:10px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:14px; color:#555; }
        button { width:100%; padding:12px; background-color:#2d89ef; border:none; color:white; font-size:16px; border-radius:8px; cursor:pointer; margin-top:10px; }
        button:hover { background-color:#1b5cb8; }
        .links { margin-top:15px; font-size:14px; }
        .links a { color:#2d89ef; text-decoration:none; }
        .links a:hover { text-decoration:underline; }
        .msg { display:none; padding:10px; border-radius:8px; margin-bottom:15px; font-weight:600; }
        .success-msg { background:#4caf50; color:white; }
        .error-msg { background:#f44336; color:white; }
        footer { text-align:center; padding:15px; background:#2d89ef; color:white; margin-top:auto; }
        @media (max-width: 768px) {
    header {
        flex-direction: column;
        align-items: flex-start;
    }
    nav a {
        margin: 10px 0;
        display: block;
    }
    main {
        padding: 20px;
        grid-template-columns: 1fr;
    }
    .card {
        max-width: 100%;
        margin: auto;
    }
    img, video, iframe {
        max-height: 150px;
    }
    button {
        width: 100%;
        margin-top: 8px;
    }
}

    </style>
</head>
<body>
<header>
    <h1>CloudVault</h1>
    <nav>
        <a href="/index">Home</a>
        <a href="/about">About</a>
        <a href="/login">Login</a>
        <a href="/register">Register</a>
    </nav>
</header>

<main>
    <div class="forgot-container">
        <h2>Reset Password</h2>
        <div id="message" class="msg"></div>

        <form id="resetForm">
            <input type="email" name="email" placeholder="Enter your registered email" required>
            <input type="text" name="otp" placeholder="Enter OTP" required>

            <div class="input-group">
                <input type="password" name="newPassword" id="newPassword" placeholder="New Password" required>
                <span class="toggle-password" onclick="togglePassword('newPassword')">🫣</span>
            </div>

            <div class="input-group">
                <input type="password" name="confirmPassword" id="confirmPassword" placeholder="Confirm Password" required>
                <span class="toggle-password" onclick="togglePassword('confirmPassword')">🫣</span>
            </div>

            <button type="submit">Reset Password</button>
        </form>

        <div class="links">
            <p>Back to <a href="/login">Login</a></p>
        </div>
    </div>
</main>

<footer>© 2025 CloudVault. All Rights Reserved.</footer>

<script>
    function togglePassword(fieldId) {
        const input = document.getElementById(fieldId);
        input.type = input.type === "password" ? "text" : "password";
    }

    const form = document.getElementById("resetForm");
    const messageBox = document.getElementById("message");

    function validatePasswordStrength(password) {
        const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*()_+\[\]{};':"\\|,.<>\/?]).{6,}$/;
        return regex.test(password);
    }

    form.addEventListener("submit", async function (event) {
        event.preventDefault();
        const email = form.email.value.trim();
        const otp = form.otp.value.trim();
        const newPassword = form.newPassword.value.trim();
        const confirmPassword = form.confirmPassword.value.trim();

        if (!validatePasswordStrength(newPassword)) {
            messageBox.textContent = "Password must be 6+ chars with uppercase, lowercase, number, special char!";
            messageBox.className = "msg error-msg";
            messageBox.style.display = "block";
            return;
        }

        if (newPassword !== confirmPassword) {
            messageBox.textContent = "Passwords do not match!";
            messageBox.className = "msg error-msg";
            messageBox.style.display = "block";
            return;
        }

        try {
            const response = await fetch("/forgot-password/reset", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams({ email, otp, newPassword, confirmPassword })
            });

            const resultText = await response.text();

            if (response.ok) {
                messageBox.textContent = "Password reset successfully! Redirecting...";
                messageBox.className = "msg success-msg";
                messageBox.style.display = "block";
                setTimeout(() => window.location.href = "/login", 2000);
            } else {
                messageBox.textContent = resultText || "Invalid OTP or failed to reset password!";
                messageBox.className = "msg error-msg";
                messageBox.style.display = "block";
            }
        } catch (error) {
            messageBox.textContent = "Something went wrong! Please try again.";
            messageBox.className = "msg error-msg";
            messageBox.style.display = "block";
        }
    });
</script>
</body>
</html>

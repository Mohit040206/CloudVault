<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudVault - Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; margin:0; padding:0; background:url('/images/logovault.png') no-repeat center center fixed; background-size:cover; overflow-x:hidden; }
    header { background:#2d89ef; color:white; padding:15px 30px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
    header h1 { margin:0; }
     nav {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    nav a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s;
    }
    nav a:hover {
      color: #ffe082;
    }

    .register-container { background: rgba(255,255,255,0.7); backdrop-filter: blur(6px); padding:30px; border-radius:12px; box-shadow:0px 4px 15px rgba(0,0,0,0.2); width:350px; text-align:center; margin:60px auto; }
    h2 { margin-bottom:20px; color:#333; }
    .input-group { position:relative; width:100%; }
    input { width:100%; padding:12px; margin:8px 0; border-radius:8px; border:1px solid #ccc; font-size:14px; background: rgba(255,255,255,0.9);}
    .toggle-password { position:absolute; right:10px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:14px; color:#555; }
    button { width:100%; padding:12px; background-color:#4CAF50; border:none; color:white; font-size:16px; border-radius:8px; cursor:pointer;}
    button:hover { background-color:#45a049; }
    .link { margin-top:15px; font-size:14px; }
    .link a { color:#007bff; text-decoration:none; }
    .link a:hover { text-decoration:underline; }
    .error { color:red; font-size:13px; display:none; }

    footer { text-align:center; padding:15px; background:#2d89ef; color:white; margin-top:40px; }
    @media (max-width: 768px) {
    header {
        flex-direction: column;
        align-items: flex-start;
    }
    nav a {
        margin: 10px 0;
        display: block;
    }
    main {
        padding: 20px;
        grid-template-columns: 1fr;
    }
    .card {
        max-width: 100%;
        margin: auto;
    }
    img, video, iframe {
        max-height: 150px;
    }
    button {
        width: 100%;
        margin-top: 8px;
    }
}

  </style>
</head>
<body>
<header>
  <h1>CloudVault</h1>
  <nav>
    <a href="/index">Home</a>
    <a href="/about">About</a>
    <a href="/login">Login</a>

  </nav>
</header>

<div class="register-container">
  <h2>User Registration</h2>
  <form action="/user/register" method="post" onsubmit="return validateForm()">
    <input type="text" name="name" placeholder="Full Name" required>
    <input type="text" name="phoneNo" placeholder="Phone Number" required>
    <input type="email" name="email" placeholder="Email Address" required>

    <div class="input-group">
      <input type="password" id="password" name="password" placeholder="Password" required>
      <span class="toggle-password" onclick="togglePassword('password')">🫣</span>
    </div>

    <div class="input-group">
      <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
      <span class="toggle-password" onclick="togglePassword('confirmPassword')">🫣</span>
    </div>

    <p class="error" id="errorMsg"></p>
    <button type="submit">Register</button>
  </form>
  <div class="link">
    <p>Already have an account? <a href="/login">Login here</a></p>
  </div>
</div>

<footer>
  © 2025 CloudVault. All Rights Reserved.
</footer>

<script>
  function togglePassword(fieldId) {
      const input = document.getElementById(fieldId);
      input.type = input.type === "password" ? "text" : "password";
  }

  function validateForm() {
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const errorMsg = document.getElementById("errorMsg");

      const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*()_+\[\]{};':"\\|,.<>\/?]).{6,}$/;

      if (!regex.test(password)) {
          errorMsg.textContent = "Password must be at least 6 characters with uppercase, lowercase, number, and special character!";
          errorMsg.style.display = "block";
          return false;
      }

      if (password !== confirmPassword) {
          errorMsg.textContent = "Passwords do not match!";
          errorMsg.style.display = "block";
          return false;
      }

      errorMsg.style.display = "none";
      return true;
  }
</script>
</body>
</html>
